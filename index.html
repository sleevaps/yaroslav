<span style="font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: #E8452C">С днём рождения</span>

<div style="position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0">

</div>
</header>

      this[key] = arr;

    this.setState({ count: this.state.count + (n || 40) });

    s.appendChild(c);

}
